name: Build and test

on:
  push:
    branches: [main, develop]

  pull_request:

permissions:
  contents: read

jobs:

  # ============================================================
  # Ubuntu 24.04
  # ============================================================
  ubuntu:
    name: Ubuntu 24.04 (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-serialport-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja


  # ============================================================
  # Fedora
  # ============================================================
  fedora:
    name: Fedora 44 (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: fedora:44

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git \
            gcc \
            gcc-c++ \
            cmake \
            ninja-build \
            make \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtserialport-devel \
            qt6-qttools-devel \
            systemd-devel \
            libusb1-devel

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja


  # ============================================================
  # Arch Linux
  # ============================================================
  arch:
    name: Arch Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: archlinux:base-devel

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git \
            cmake \
            ninja \
            pkgconf \
            qt6-base \
            qt6-declarative \
            qt6-serialport \
            qt6-tools \
            libusb \
            systemd

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja


  # ============================================================
  # Linux Mint 22.3
  # ATENÇÃO: imagem Docker comunitária
  # ============================================================
  mint:
    name: Linux Mint 22.3 (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: linuxmintd/mint22.3-amd64:latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            git \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-serialport-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja


  # ============================================================
  # Windows
  # ============================================================
  windows:
    name: Windows 2025 (MinGW)
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      QT_ROOT_DIR: C:/msys64/ucrt64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            qt6-base:p
            qt6-declarative:p
            qt6-serialport:p
            qt6-tools:p

      - name: Configure
        run: cmake --preset windows-mingw

      - name: Build
        run: cmake --build --preset windows-mingw

      - name: Test
        run: ctest --preset windows-mingw