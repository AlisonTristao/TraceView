name: Build and test

on:
  push:
    branches: [main, develop]

  pull_request:

permissions:
  contents: read

jobs:

  # ============================================================
  # Ubuntu 24.04
  # ============================================================
  ubuntu:
    name: Ubuntu 24.04 (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-svg-dev \
            qt6-serialport-dev \
            qt6-connectivity-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja


  # ============================================================
  # Fedora
  # ============================================================
  fedora:
    name: Fedora 44 (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: fedora:44

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git \
            gcc \
            gcc-c++ \
            cmake \
            ninja-build \
            make \
            pkgconf-pkg-config \
            qt6-qtbase-devel \
            qt6-qtdeclarative-devel \
            qt6-qtsvg-devel \
            qt6-qtserialport-devel \
            qt6-qtconnectivity-devel \
            qt6-qttools-devel \
            systemd-devel \
            libusb1-devel

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja


  # ============================================================
  # Arch Linux
  # ============================================================
  arch:
    name: Arch Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: archlinux:base-devel

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git \
            cmake \
            ninja \
            pkgconf \
            qt6-base \
            qt6-declarative \
            qt6-svg \
            qt6-serialport \
            qt6-connectivity \
            qt6-tools \
            libusb \
            systemd

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja


  # ============================================================
  # Linux Mint 22.3
  # ATENÇÃO: imagem Docker comunitária
  # ============================================================
  mint:
    name: Linux Mint 22.3 (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    container:
      image: linuxmintd/mint22.3-amd64:latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install --no-install-recommends -y \
            git \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            qt6-svg-dev \
            qt6-serialport-dev \
            qt6-connectivity-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            libudev-dev \
            libusb-1.0-0-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja


  # ============================================================
  # Windows
  # ============================================================
  windows:
    name: Windows 2025 (MinGW)
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      QT_ROOT_DIR: C:/msys64/ucrt64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            qt6-serialport:p
            qt6-connectivity:p
            qt6-tools:p

      - name: Configure
        run: cmake --preset windows-mingw

      - name: Build
        run: cmake --build --preset windows-mingw

      - name: Test
        run: ctest --preset windows-mingw

  # ============================================================
  # macOS (Apple Silicon)
  # Qt from aqtinstall rather than Homebrew: the same pinned 6.9.2 the
  # Android jobs use, and the same kit release.yml packages with
  # macdeployqt. qtserialport/qtconnectivity are addon modules there.
  # ============================================================
  macos:
    name: macOS 14 (Apple Clang, arm64)
    runs-on: macos-14
    timeout-minutes: 45

    env:
      QT_VERSION: "6.9.2"
      AQTINSTALL_VERSION: "3.3.0"
      QT_ROOT_DIR: ${{ github.workspace }}/qt/6.9.2/macos
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja and aqtinstall
        run: |
          brew install ninja
          python -m pip install --quiet "aqtinstall==${{ env.AQTINSTALL_VERSION }}"

      - name: Install Qt (macOS)
        run: |
          python -m aqt install-qt mac desktop "${{ env.QT_VERSION }}" clang_64 \
            --modules qtserialport qtconnectivity --outputdir "${{ github.workspace }}/qt"

      - name: Configure
        run: cmake --preset macos

      - name: Build
        run: cmake --build --preset macos

      # test_bletransport is left out here only: its discovery lifecycle
      # case starts a real scan, and macOS refuses Bluetooth to a bare test
      # executable (no app bundle, so no NSBluetoothAlwaysUsageDescription)
      # -- the permission comes back Denied and the scan never starts. The
      # same test runs on every other desktop job.
      - name: Test
        run: ctest --preset macos -E '^test_bletransport$'


  # ============================================================
  # iOS (arm64 device)
  # Build only, unsigned (CODE_SIGNING_ALLOWED=NO): installing on a device
  # needs an Apple Developer signing identity, which CI does not have. No
  # serial or USB HID on iOS -- the ios preset turns both off, see
  # docs/MACOS_IOS_BUILD.md. The macOS kit is the host (moc/rcc/lrelease).
  # ============================================================
  ios:
    name: iOS (arm64, build only, unsigned)
    runs-on: macos-14
    timeout-minutes: 60

    env:
      QT_VERSION: "6.9.2"
      AQTINSTALL_VERSION: "3.3.0"
      QT_ROOT_DIR: ${{ github.workspace }}/qt/6.9.2/macos
      QT_IOS_ROOT_DIR: ${{ github.workspace }}/qt/6.9.2/ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install aqtinstall
        run: python -m pip install --quiet "aqtinstall==${{ env.AQTINSTALL_VERSION }}"

      - name: Install Qt (macOS host tools)
        run: |
          python -m aqt install-qt mac desktop "${{ env.QT_VERSION }}" clang_64 \
            --outputdir "${{ github.workspace }}/qt"

      - name: Install Qt (iOS)
        run: |
          python -m aqt install-qt mac ios "${{ env.QT_VERSION }}" ios \
            --modules qtconnectivity --outputdir "${{ github.workspace }}/qt"

      - name: Configure
        run: cmake --preset ios

      - name: Build
        run: cmake --build --preset ios -- CODE_SIGNING_ALLOWED=NO


  # ============================================================
  # Android (arm64-v8a)
  # Build only: the android-arm64 preset sets TRACEVIEW_BUILD_TESTS=OFF,
  # since arm64 test binaries can't run on this x86 runner. Debug preset,
  # so Gradle signs with a throwaway debug key and no secrets are needed
  # (PRs from forks work). Setup mirrors release.yml's android-package;
  # see that job's comments for why each step is done the way it is.
  # ============================================================
  android:
    name: Android (arm64-v8a, build only)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      QT_VERSION: "6.9.2"
      QT_INSTALL_DIR: ${{ github.workspace }}/qt
      AQTINSTALL_VERSION: "3.3.0"
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_ROOT: ${{ github.workspace }}/android-sdk/ndk/27.2.12479018
      QT_ANDROID_ROOT_DIR: ${{ github.workspace }}/qt/6.9.2/android_arm64_v8a
      QT_ROOT_DIR: ${{ github.workspace }}/qt/6.9.2/gcc_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ninja-build

      - name: Install aqtinstall
        run: python3 -m pip install --quiet "aqtinstall==${{ env.AQTINSTALL_VERSION }}"

      - name: Install Qt (desktop host tools)
        run: |
          python3 -m aqt install-qt linux desktop "${{ env.QT_VERSION }}" linux_gcc_64 \
            --outputdir "${{ env.QT_INSTALL_DIR }}"

      - name: Install Qt (Android arm64-v8a)
        run: |
          python3 -m aqt install-qt linux android "${{ env.QT_VERSION }}" android_arm64_v8a \
            --modules qtconnectivity --outputdir "${{ env.QT_INSTALL_DIR }}"

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          mv /tmp/cmdline-tools-extract/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"

      - name: Install SDK platform, build-tools and NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          # Retried: a download occasionally arrives truncated on the runner
          # ("Error reading Zip content"), which is transient.
          for attempt in 1 2 3; do
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
              "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}" \
              && break
            [ "$attempt" = 3 ] && exit 1
            echo "sdkmanager failed (attempt $attempt), retrying..."; sleep 15
          done

      - name: Configure
        run: cmake --preset android-arm64

      - name: Build
        run: cmake --build --preset android-arm64
