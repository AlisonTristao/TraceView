name: Build and test

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            cmake ninja-build build-essential pkg-config \
            qt6-base-dev qt6-serialport-dev qt6-tools-dev qt6-l10n-tools \
            libudev-dev libusb-1.0-0-dev

      - name: Configure
        run: cmake --preset linux-ninja

      - name: Build
        run: cmake --build --preset linux-ninja

      - name: Test
        run: ctest --preset linux-ninja

  windows:
    name: Windows (MinGW)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      QT_ROOT_DIR: C:/msys64/ucrt64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            qt6-base:p
            qt6-serialport:p
            qt6-tools:p

      - name: Configure
        run: cmake --preset windows-mingw

      - name: Build
        run: cmake --build --preset windows-mingw

      - name: Test
        run: ctest --preset windows-mingw
