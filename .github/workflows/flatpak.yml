name: Flatpak

on:
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Flatpak repository to gh-pages
        required: false
        type: boolean
        default: false
  pull_request:

permissions:
  contents: write

env:
  # A .flatpakrepo descriptor (not the raw repo URL) -- flatpak build-bundle
  # needs its Title/Url/GPGKey fields to add the remote automatically when an
  # end user installs the bundle without the runtime already present. Mirrored
  # by the linux-flatpak-runtime-mirror job below, not fetched from Flathub, so
  # end-user installs never depend on a third-party app store.
  TRACEVIEW_FLATPAK_RUNTIME_REPO: ${{ vars.TRACEVIEW_FLATPAK_RUNTIME_REPO || 'https://alisontristao.github.io/TraceView/traceview-runtime.flatpakrepo' }}

jobs:
  linux-flatpak-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore published Flatpak repository
        if: inputs.publish
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.kde.Platform//6.10 org.kde.Sdk//6.10
      - name: Validate Linux metadata
        run: |
          desktop-file-validate resources/linux/io.github.alisontristao.TraceView.desktop
          appstreamcli validate --no-net resources/linux/io.github.alisontristao.TraceView.metainfo.xml
      - name: Build in offline sandbox and export bundle
        run: |
          manifest=io.github.alisontristao.TraceView.yml
          if [[ -d gh-pages/flatpak/objects ]]; then
            mkdir -p flatpak-repo
            cp -a gh-pages/flatpak/. flatpak-repo/
          fi
          flatpak-builder --user --download-only build-flatpak "$manifest"
          flatpak-builder --user --disable-download --sandbox --force-clean --repo=flatpak-repo build-flatpak "$manifest"
          flatpak build-update-repo --generate-static-deltas flatpak-repo
          version=$(sed -n 's/^    VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          if [[ $GITHUB_REF_TYPE == tag ]]; then version=${GITHUB_REF_NAME#v}; fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p build/flatpak-package
          flatpak build-bundle --runtime-repo="$TRACEVIEW_FLATPAK_RUNTIME_REPO" \
            flatpak-repo "build/flatpak-package/TraceView-$version-linux-x64.flatpak" \
            io.github.alisontristao.TraceView stable
          cd build/flatpak-package
          sha256sum TraceView-*-linux-x64.flatpak > sha256-flatpak.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-package
          path: build/flatpak-package/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-repo
          path: flatpak-repo
          if-no-files-found: error

  # Mirrors org.kde.Platform (the runtime declared by io.github.alisontristao.TraceView.yml,
  # not the Sdk -- end users installing the bundle never need that) from Flathub into
  # this project's own GitHub Pages repository. Runs only on real releases (not PRs):
  # pulling a several-hundred-MB runtime on every PR would be slow and mostly wasted,
  # since the runtime version rarely changes between releases.
  #
  # ostree pull --mirror copies the runtime's commit objects byte-for-byte, so nothing
  # here re-signs or re-builds it -- it is the same content Flathub serves, just
  # re-hosted. It pulls directly from Flathub's own repo URL rather than through a
  # local `flatpak install`, since flatpak namespaces an installed ref under its
  # remote (refs/remotes/flathub/...) instead of leaving a plain ref pull-local can
  # resolve, and --mirror is what writes the plain, servable ref this job needs.
  # Neither this repo nor packaging/flatpak/traceview-runtime.flatpakrepo declares a
  # GPGKey, matching the (also unsigned) io.github.alisontristao.TraceView app repo:
  # flatpak treats a remote with no GPGKey as gpg-verify=false, and --no-gpg-verify
  # below matches that same trust level for the pull itself.
  linux-flatpak-runtime-mirror:
    name: Mirror KDE runtime to GitHub Pages
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Restore published runtime mirror
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Install Flatpak and OSTree tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak ostree
      - name: Update the mirror repository
        run: |
          mkdir -p runtime-repo
          if [[ -d gh-pages/flatpak-runtime/objects ]]; then
            cp -a gh-pages/flatpak-runtime/. runtime-repo/
          else
            ostree --repo=runtime-repo init --mode=archive
          fi
          ostree --repo=runtime-repo remote add --if-not-exists --no-gpg-verify flathub https://dl.flathub.org/repo/
          ostree --repo=runtime-repo pull --mirror flathub runtime/org.kde.Platform/x86_64/6.10
          flatpak build-update-repo runtime-repo
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-runtime-repo
          path: runtime-repo
          if-no-files-found: error

  linux-flatpak-smoke:
    needs: linux-flatpak-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-flatpak-package
          path: package
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak dbus-daemon
      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.kde.Platform//6.10
      - name: Launch packaged application
        run: dbus-run-session -- bash scripts/smoke_linux_flatpak.sh package/TraceView-*-linux-x64.flatpak
