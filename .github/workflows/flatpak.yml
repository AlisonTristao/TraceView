name: Flatpak

on:
  workflow_call:
    inputs:
      publish:
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the Flatpak repository to gh-pages
        required: false
        type: boolean
        default: false
  pull_request:

permissions:
  contents: write

env:
  TRACEVIEW_FLATPAK_RUNTIME_REPO: ${{ vars.TRACEVIEW_FLATPAK_RUNTIME_REPO || 'https://flathub.org/repo/flathub.flatpakrepo' }}
  # Public fingerprint of the key packaging/flatpak/TraceView.flatpakref and
  # traceview.flatpakrepo embed as GPGKey=. The private half is the
  # TRACEVIEW_FLATPAK_GPG_PRIVATE_KEY repository secret.
  TRACEVIEW_FLATPAK_GPG_KEY_ID: F971923166EC1E6546CC222995B651D31326BBAA

jobs:
  linux-flatpak-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore published Flatpak repository
        if: inputs.publish
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.kde.Platform//6.10 org.kde.Sdk//6.10
      - name: Validate Linux metadata
        run: |
          desktop-file-validate resources/linux/io.github.alisontristao.TraceView.desktop
          appstreamcli validate --no-net resources/linux/io.github.alisontristao.TraceView.metainfo.xml
      - name: Import Flatpak signing key
        if: inputs.publish
        env:
          TRACEVIEW_FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.TRACEVIEW_FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p /tmp/tv-gpg
          chmod 700 /tmp/tv-gpg
          echo "$TRACEVIEW_FLATPAK_GPG_PRIVATE_KEY" | gpg --homedir /tmp/tv-gpg --batch --import
      - name: Build in offline sandbox and export bundle
        run: |
          manifest=io.github.alisontristao.TraceView.yml
          if [[ -d gh-pages/flatpak/objects ]]; then
            mkdir -p flatpak-repo
            cp -a gh-pages/flatpak/. flatpak-repo/
          fi
          flatpak-builder --user --download-only build-flatpak "$manifest"
          flatpak-builder --user --disable-download --sandbox --force-clean --repo=flatpak-repo build-flatpak "$manifest"
          gpg_args=()
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            gpg_args=(--gpg-sign="$TRACEVIEW_FLATPAK_GPG_KEY_ID" --gpg-homedir=/tmp/tv-gpg)
          fi
          flatpak build-update-repo --generate-static-deltas "${gpg_args[@]}" flatpak-repo
          version=$(sed -n 's/^    VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt)
          if [[ $GITHUB_REF_TYPE == tag ]]; then version=${GITHUB_REF_NAME#v}; fi
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p build/flatpak-package
          flatpak build-bundle --runtime-repo="$TRACEVIEW_FLATPAK_RUNTIME_REPO" \
            flatpak-repo "build/flatpak-package/TraceView-$version-linux-x64.flatpak" \
            io.github.alisontristao.TraceView stable
          cd build/flatpak-package
          sha256sum TraceView-*-linux-x64.flatpak > sha256-flatpak.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-package
          path: build/flatpak-package/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-repo
          path: flatpak-repo
          if-no-files-found: error

  linux-flatpak-smoke:
    needs: linux-flatpak-package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-flatpak-package
          path: package
      - name: Install Flatpak tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak dbus-daemon
      - name: Install Flatpak runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.kde.Platform//6.10
      - name: Launch packaged application
        run: dbus-run-session -- bash scripts/smoke_linux_flatpak.sh package/TraceView-*-linux-x64.flatpak
