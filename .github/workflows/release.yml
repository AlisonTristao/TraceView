name: Release

# Builds the Windows NSIS installer and the Linux .AppImage from a Release
# configuration (see CMakePresets.json's *-release presets and CMakeLists.txt's
# CPack block) and publishes both, plus a combined SHA256SUMS.txt, as a GitHub
# Release -- what lib/updater/updatechecker.cpp polls for. See CONTRIBUTING.md
# for the tag/versioning flow that triggers this.
#
# Marked --prerelease for now, while the self-update mechanism itself is still
# being validated in practice: UpdateChecker reads the release LIST endpoint
# rather than /releases/latest specifically so this still works once that flag
# is dropped from future releases (see that file's own comment).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:

  # ============================================================
  # Windows package (NSIS)
  # ============================================================
  windows-package:
    name: Windows package (NSIS)
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      QT_ROOT_DIR: C:/msys64/ucrt64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            qt6-serialport:p
            qt6-tools:p

      # NSIS itself (makensis.exe) isn't an MSYS2/Qt package -- installed as a
      # regular Windows tool via Chocolatey (preinstalled on this runner image),
      # in its own PowerShell step since the job's default shell is msys2/bash.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Configure (Release)
        run: cmake --preset windows-mingw-release

      - name: Build (Release)
        run: cmake --build --preset windows-mingw-release

      - name: Package (CPack / NSIS)
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version' >&2; exit 1; }
          cd build/windows-mingw-release
          cpack -G NSIS -D "CPACK_PACKAGE_FILE_NAME=TraceView-$version-windows-x64"

      - name: Compute checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem build/windows-mingw-release/TraceView-*-windows-x64.exe | Select-Object -First 1
          if (-not $file) { throw "No NSIS installer found under build/windows-mingw-release" }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -FilePath "build/windows-mingw-release/sha256-windows.txt" -Encoding ascii

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            build/windows-mingw-release/TraceView-*-windows-x64.exe
            build/windows-mingw-release/sha256-windows.txt
          if-no-files-found: error

  windows-smoke:
    name: Windows installer smoke
    needs: windows-package
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: package

      - name: Install and launch package
        shell: pwsh
        run: |
          $installer = Get-ChildItem package/TraceView-*-windows-x64.exe | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer found under package" }
          .\scripts\smoke_windows_installer.ps1 -Installer $installer.FullName

  # ============================================================
  # Android package (.apk)
  # ============================================================
  # Builds the android-arm64-release preset and signs it with the project's
  # own release keystore (GitHub Secrets, see docs/ANDROID_BUILD.md's
  # "Release signing"). Every release MUST carry the same key: Android only
  # installs an APK over an existing one signed by the same certificate,
  # which is what the in-app updater relies on.
  android-package:
    name: Android package (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      QT_VERSION: "6.9.2"
      QT_INSTALL_DIR: ${{ github.workspace }}/qt
      AQTINSTALL_VERSION: "3.3.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        # androiddeployqt/Gradle need this specific major version -- see
        # docs/ANDROID_BUILD.md's "Why these versions" table (this machine's
        # own JDK 25 is too new for what Qt 6.9 was validated against).
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ninja-build

      - name: Install aqtinstall
        run: python3 -m pip install --quiet "aqtinstall==${{ env.AQTINSTALL_VERSION }}"

      - name: Install Qt (desktop host tools)
        # moc/rcc/androiddeployqt/qmlimportscanner must run as native Linux
        # binaries even though TraceView itself cross-compiles for Android --
        # see docs/ANDROID_BUILD.md's QT_ROOT_DIR explanation. Called
        # directly rather than via jurplel/install-qt-action -- that
        # action's own version-resolution step (`aqt list-qt ... --spec
        # ... --latest-version`) hit a separate quirk for the Android target
        # below, so a direct aqt call is one less layer to debug blind for
        # both. arch is "linux_gcc_64", not the bare "gcc_64" a lot of
        # examples use -- aqtinstall (checked locally: v3.2.1 and v3.3.0,
        # current latest) fails to resolve the Linux desktop qt_base package
        # at all with the short form ("packages ['qt_base'] were not found
        # while parsing XML of package information!"); the long form is
        # what `aqt list-qt linux desktop --arch 6.9.2` itself reports as
        # the real identifier. The installed layout still lands at
        # <dir>/<version>/gcc_64 either way (confirmed locally), matching
        # QT_ROOT_DIR below.
        run: |
          python3 -m aqt install-qt linux desktop "${{ env.QT_VERSION }}" linux_gcc_64 \
            --outputdir "${{ env.QT_INSTALL_DIR }}"

      - name: Install Qt (Android arm64-v8a)
        # qtconnectivity is an addon module (not installed by default) --
        # required because TRACEVIEW_ENABLE_BLE=ON in the android-arm64
        # preset links Qt6::Bluetooth. Called directly rather than via
        # jurplel/install-qt-action -- that action's internal version
        # resolution (`aqt list-qt linux android --spec 6.9.2
        # --latest-version`) failed with "No latest version available for
        # this request": `aqt list-qt linux android` (bare, no --arch) only
        # enumerates versions up to 6.7.3 in its locally bundled index,
        # stale relative to what the live repository actually serves. A
        # direct `aqt install-qt` call (no --spec resolution step) finds
        # and installs 6.9.2 fine, confirmed locally including a real
        # package download.
        run: |
          python3 -m aqt install-qt linux android "${{ env.QT_VERSION }}" android_arm64_v8a \
            --modules qtconnectivity --outputdir "${{ env.QT_INSTALL_DIR }}"

      - name: Install Android SDK command-line tools
        # Downloaded directly rather than via a third-party setup action --
        # same recipe validated by hand on a developer machine (see
        # TAREFAS_TCP_BLE_ANDROID.txt's T45 note), so ANDROID_SDK_ROOT ends
        # up at a path this job fully controls instead of guessing whatever
        # env var name/location an action happens to export.
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
          mv /tmp/cmdline-tools-extract/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

      - name: Install SDK platform, build-tools and NDK
        # Exact versions pinned in docs/ANDROID_BUILD.md's compatibility
        # table.
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;${{ env.ANDROID_NDK_VERSION }}"
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

      # Release, not Debug: the Debug preset's APK is signed with a debug
      # keystore Gradle generates fresh on every CI runner, so each release
      # used to carry a different certificate and Android refused to update
      # one over another ("package conflicts"). assembleRelease produces an
      # unsigned (already zipaligned) APK that the next step signs with the
      # project's own key.
      - name: Configure (Release)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_NDK_ROOT: ${{ github.workspace }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          QT_ANDROID_ROOT_DIR: ${{ env.QT_INSTALL_DIR }}/${{ env.QT_VERSION }}/android_arm64_v8a
          QT_ROOT_DIR: ${{ env.QT_INSTALL_DIR }}/${{ env.QT_VERSION }}/gcc_64
        run: cmake --preset android-arm64-release

      - name: Build (Release)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_NDK_ROOT: ${{ github.workspace }}/android-sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
          QT_ANDROID_ROOT_DIR: ${{ env.QT_INSTALL_DIR }}/${{ env.QT_VERSION }}/android_arm64_v8a
          QT_ROOT_DIR: ${{ env.QT_INSTALL_DIR }}/${{ env.QT_VERSION }}/gcc_64
        run: cmake --build --preset android-arm64-release

      # Secrets: ANDROID_KEYSTORE_BASE64 (the .jks, base64-encoded) and
      # ANDROID_KEYSTORE_PASSWORD (PKCS12 keystores use one password for both
      # the store and the key). The key alias is always "traceview". Fails
      # loudly rather than ever falling back to an unsigned or debug-signed
      # APK, which would break updates for everyone who installed this one.
      - name: Sign APK
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [[ -n $ANDROID_KEYSTORE_BASE64 && -n $ANDROID_KEYSTORE_PASSWORD ]] ||
            { echo 'ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are not set' >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version' >&2; exit 1; }
          keystore="$RUNNER_TEMP/traceview-release.jks"
          trap 'rm -f "$keystore"' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          build_tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          cd build/android-arm64-release/android-build
          "$build_tools/zipalign" -c -P 16 4 TraceView.apk
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias traceview \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "TraceView-$version-android-arm64.apk" TraceView.apk
          sha256sum "TraceView-$version-android-arm64.apk" > sha256-android.txt

      # Cheap, no emulator needed -- catches the exact failure class that
      # shipped in the first v4.0.0 attempt (an unsigned APK from the
      # Release preset, which installs nowhere: apksigner reported "Missing
      # META-INF/MANIFEST.MF", device installers just say "invalid file").
      # `aapt dump badging` separately confirms AndroidManifest.xml parses
      # and prints the resolved package identity into the job log, so a
      # wrong package name/version (like the Qt placeholder this job also
      # used to ship, see T45's note) shows up here too instead of only
      # being caught by eyeballing a release page. When the repository
      # variable ANDROID_SIGNING_CERT_SHA256 is set, the signer certificate
      # must match it too -- a swapped keystore secret would otherwise ship
      # an APK no existing install can update to.
      - name: Verify APK signature and manifest
        run: |
          apk=$(echo build/android-arm64-release/android-build/TraceView-*-android-arm64.apk)
          build_tools="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/apk-certs.txt"
          "$build_tools/aapt" dump badging "$apk" | grep -E "^package:|launchable-activity:"
          if [[ -n $EXPECTED_CERT_SHA256 ]]; then
            actual=$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/apk-certs.txt" | awk '{print $NF}')
            expected=$(echo "$EXPECTED_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
            [[ $actual == "$expected" ]] ||
              { echo "Signer certificate $actual does not match ANDROID_SIGNING_CERT_SHA256" >&2; exit 1; }
          fi
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: |
            build/android-arm64-release/android-build/TraceView-*-android-arm64.apk
            build/android-arm64-release/android-build/sha256-android.txt
          if-no-files-found: error

  # ============================================================
  # Linux package (.AppImage)
  # ============================================================
  linux-package:
    name: Linux package (.AppImage)
    # Built on the oldest Ubuntu LTS we still support (22.04) rather than
    # ubuntu-24.04: binaries link against whatever glibc/libstdc++ is on the
    # build host, and glibc symbol versioning is forward-only (an older
    # glibc's libc.so.6 can't satisfy a GLIBC_2.38 requirement baked in by a
    # 24.04 build). AppImage bundles Qt but never libc itself, so building on
    # 24.04 silently produced AppImages that only ran on 24.04+ hosts -- this
    # is what broke the ubuntu:22.04 leg of the linux-smoke matrix below.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        # Ubuntu 22.04 names Qt SVG's development package libqt6svg6-dev;
        # qt6-svg-dev is the name used by newer Ubuntu releases.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6svg6-dev \
            libqt6serialport6-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            qt6-wayland \
            libgl1-mesa-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            patchelf \
            curl \
            file \
            desktop-file-utils

      - name: Work around missing Qt6::lprodump in qt6-l10n-tools
        # Debian/Ubuntu's qt6-l10n-tools never ships lprodump (only lconvert,
        # lrelease, lupdate, and the -pro helpers), but Qt6LinguistToolsTargets.cmake
        # unconditionally checks every imported target's file exists, failing
        # find_package(Qt6 ... LinguistTools) outright. We don't use lprodump
        # (no .pro files), so a stub pointing at an existing tool satisfies the check.
        run: sudo ln -sf /usr/lib/qt6/libexec/lupdate-pro /usr/lib/qt6/libexec/lprodump

      - name: Configure (Release)
        run: cmake --preset linux-ninja-release

      - name: Build (Release)
        run: cmake --build --preset linux-ninja-release

      - name: Package (AppImage)
        run: bash scripts/build_linux_appimage.sh build/linux-ninja-release "${GITHUB_REF_NAME#v}"

      - name: Compute checksum
        run: |
          cd build/linux-ninja-release
          sha256sum TraceView-*-linux-x64.AppImage > sha256-linux.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            build/linux-ninja-release/TraceView-*-linux-x64.AppImage
            build/linux-ninja-release/sha256-linux.txt
          if-no-files-found: error

  linux-smoke:
    name: AppImage smoke (${{ matrix.image }})
    needs: linux-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, fedora:44, 'archlinux:base-devel', 'linuxmintd/mint22.3-amd64:latest']
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install desktop runtime (no Qt)
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates libgl1 libegl1 libopengl0 libharfbuzz0b \
              libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libfontconfig1 \
              libdbus-1-3 libudev1
          elif command -v dnf >/dev/null; then
            dnf install -y mesa-libGL mesa-libEGL libglvnd-opengl harfbuzz libxkbcommon-x11 xcb-util-cursor \
              xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil \
              fontconfig dbus-libs systemd-libs
          else
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed mesa libglvnd libxkbcommon-x11 \
              xcb-util-cursor xcb-util-wm xcb-util-image xcb-util-keysyms \
              xcb-util-renderutil fontconfig harfbuzz dbus systemd-libs
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: package
      - name: Launch without system Qt or FUSE
        shell: bash
        run: |
          if ldconfig -p | grep 'libQt6Core'; then
            echo 'Smoke image unexpectedly contains system Qt 6' >&2
            exit 1
          fi
          bash scripts/smoke_linux_appimage.sh package/TraceView-*-linux-x64.AppImage

  # ============================================================
  # Publish the GitHub Release packages feed into
  # ============================================================
  linux-flatpak:
    name: Linux Flatpak package and smoke
    uses: ./.github/workflows/flatpak.yml
    with:
      publish: true
    secrets: inherit
    permissions:
      contents: write

  publish:
    name: Publish release
    needs: [windows-smoke, linux-smoke, linux-flatpak, android-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: linux-flatpak-repo
          path: flatpak-repo

      - name: Update the GitHub Pages Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git clone --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages; then
            echo 'Restored existing gh-pages branch'
          else
            rm -rf pages
            mkdir pages
            cd pages
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cd ..
          fi
          rm -rf pages/flatpak
          mkdir -p pages/flatpak
          cp -a flatpak-repo/. pages/flatpak/
          cp packaging/flatpak/TraceView.flatpakref pages/TraceView.flatpakref
          cp packaging/flatpak/traceview.flatpakrepo pages/traceview.flatpakrepo
          cp packaging/flatpak/index.html pages/index.html
          cd pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flatpak TraceView.flatpakref traceview.flatpakrepo index.html
          git commit -m "Publish TraceView ${GITHUB_REF_NAME}" || true
          git push origin gh-pages

      - name: Combine checksums
        run: |
          cat packages/windows-package/sha256-windows.txt packages/linux-package/sha256-linux.txt packages/linux-flatpak-package/sha256-flatpak.txt packages/android-package/sha256-android.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            packages/windows-package/TraceView-*-windows-x64.exe \
            packages/linux-package/TraceView-*-linux-x64.AppImage \
            packages/linux-flatpak-package/TraceView-*-linux-x64.flatpak \
            packages/android-package/TraceView-*-android-arm64.apk \
            SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --title "TraceView ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease

      # A tag in this same MAJOR.MINOR line (e.g. v2.5.4 superseding
      # v2.5.0-v2.5.3) means the older ones were patch-level fixes on top of
      # each other, not separate versions worth keeping visible -- retiring
      # them keeps the Releases page (and anyone browsing it by hand,
      # instead of through the self-updater, which always reads the newest
      # one anyway) from offering a known-broken download. `gh release
      # delete` without --cleanup-tag removes only the Release and its
      # assets; the git tag itself is left alone, so `vX.Y.Z` still resolves
      # to the exact commit it always did. A different MINOR or MAJOR (a
      # real new version, not a fix cycle) is never touched.
      - name: Retire older releases in this minor line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${{ github.ref_name }}"
          minor="${current%.*}"
          gh release list --repo "${{ github.repository }}" --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$current" ] && [ "${tag%.*}" = "$minor" ]; then
              echo "Deleting superseded release $tag (its tag stays in git history)"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes
            fi
          done
