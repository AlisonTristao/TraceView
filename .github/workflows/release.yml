name: Release

# Builds the Windows NSIS installer and the Linux .AppImage from a Release
# configuration (see CMakePresets.json's *-release presets and CMakeLists.txt's
# CPack block) and publishes both, plus a combined SHA256SUMS.txt, as a GitHub
# Release -- what lib/updater/updatechecker.cpp polls for. See CONTRIBUTING.md
# for the tag/versioning flow that triggers this.
#
# Marked --prerelease for now, while the self-update mechanism itself is still
# being validated in practice: UpdateChecker reads the release LIST endpoint
# rather than /releases/latest specifically so this still works once that flag
# is dropped from future releases (see that file's own comment).

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:

  # ============================================================
  # Windows package (NSIS)
  # ============================================================
  windows-package:
    name: Windows package (NSIS)
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      QT_ROOT_DIR: C:/msys64/ucrt64

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            qt6-serialport:p
            qt6-tools:p

      # NSIS itself (makensis.exe) isn't an MSYS2/Qt package -- installed as a
      # regular Windows tool via Chocolatey (preinstalled on this runner image),
      # in its own PowerShell step since the job's default shell is msys2/bash.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Configure (Release)
        run: cmake --preset windows-mingw-release

      - name: Build (Release)
        run: cmake --build --preset windows-mingw-release

      - name: Package (CPack / NSIS)
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid release version' >&2; exit 1; }
          cd build/windows-mingw-release
          cpack -G NSIS -D "CPACK_PACKAGE_FILE_NAME=TraceView-$version-windows-x64"

      - name: Compute checksum
        shell: pwsh
        run: |
          $file = Get-ChildItem build/windows-mingw-release/TraceView-*-windows-x64.exe | Select-Object -First 1
          if (-not $file) { throw "No NSIS installer found under build/windows-mingw-release" }
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -FilePath "build/windows-mingw-release/sha256-windows.txt" -Encoding ascii

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            build/windows-mingw-release/TraceView-*-windows-x64.exe
            build/windows-mingw-release/sha256-windows.txt
          if-no-files-found: error

  windows-smoke:
    name: Windows installer smoke
    needs: windows-package
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: package

      - name: Install and launch package
        shell: pwsh
        run: |
          $installer = Get-ChildItem package/TraceView-*-windows-x64.exe | Select-Object -First 1
          if (-not $installer) { throw "No Windows installer found under package" }
          .\scripts\smoke_windows_installer.ps1 -Installer $installer.FullName

  # ============================================================
  # Linux package (.AppImage)
  # ============================================================
  linux-package:
    name: Linux package (.AppImage)
    # Built on the oldest Ubuntu LTS we still support (22.04) rather than
    # ubuntu-24.04: binaries link against whatever glibc/libstdc++ is on the
    # build host, and glibc symbol versioning is forward-only (an older
    # glibc's libc.so.6 can't satisfy a GLIBC_2.38 requirement baked in by a
    # 24.04 build). AppImage bundles Qt but never libc itself, so building on
    # 24.04 silently produced AppImages that only ran on 24.04+ hosts -- this
    # is what broke the ubuntu:22.04 leg of the linux-smoke matrix below.
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        # Ubuntu 22.04 names Qt SVG's development package libqt6svg6-dev;
        # qt6-svg-dev is the name used by newer Ubuntu releases.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            qt6-base-dev \
            qt6-declarative-dev \
            libqt6svg6-dev \
            libqt6serialport6-dev \
            qt6-tools-dev \
            qt6-l10n-tools \
            qt6-wayland \
            libgl1-mesa-dev \
            libudev-dev \
            libusb-1.0-0-dev \
            patchelf \
            curl \
            file \
            desktop-file-utils

      - name: Work around missing Qt6::lprodump in qt6-l10n-tools
        # Debian/Ubuntu's qt6-l10n-tools never ships lprodump (only lconvert,
        # lrelease, lupdate, and the -pro helpers), but Qt6LinguistToolsTargets.cmake
        # unconditionally checks every imported target's file exists, failing
        # find_package(Qt6 ... LinguistTools) outright. We don't use lprodump
        # (no .pro files), so a stub pointing at an existing tool satisfies the check.
        run: sudo ln -sf /usr/lib/qt6/libexec/lupdate-pro /usr/lib/qt6/libexec/lprodump

      - name: Configure (Release)
        run: cmake --preset linux-ninja-release

      - name: Build (Release)
        run: cmake --build --preset linux-ninja-release

      - name: Package (AppImage)
        run: bash scripts/build_linux_appimage.sh build/linux-ninja-release "${GITHUB_REF_NAME#v}"

      - name: Compute checksum
        run: |
          cd build/linux-ninja-release
          sha256sum TraceView-*-linux-x64.AppImage > sha256-linux.txt

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: |
            build/linux-ninja-release/TraceView-*-linux-x64.AppImage
            build/linux-ninja-release/sha256-linux.txt
          if-no-files-found: error

  linux-smoke:
    name: AppImage smoke (${{ matrix.image }})
    needs: linux-package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, fedora:44, 'archlinux:base-devel', 'linuxmintd/mint22.3-amd64:latest']
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install desktop runtime (no Qt)
        shell: bash
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates libgl1 libegl1 libopengl0 libharfbuzz0b \
              libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
              libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libfontconfig1 \
              libdbus-1-3 libudev1
          elif command -v dnf >/dev/null; then
            dnf install -y mesa-libGL mesa-libEGL libglvnd-opengl harfbuzz libxkbcommon-x11 xcb-util-cursor \
              xcb-util-wm xcb-util-image xcb-util-keysyms xcb-util-renderutil \
              fontconfig dbus-libs systemd-libs
          else
            pacman -Syu --noconfirm
            pacman -S --noconfirm --needed mesa libglvnd libxkbcommon-x11 \
              xcb-util-cursor xcb-util-wm xcb-util-image xcb-util-keysyms \
              xcb-util-renderutil fontconfig harfbuzz dbus systemd-libs
          fi
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: package
      - name: Launch without system Qt or FUSE
        shell: bash
        run: |
          if ldconfig -p | grep 'libQt6Core'; then
            echo 'Smoke image unexpectedly contains system Qt 6' >&2
            exit 1
          fi
          bash scripts/smoke_linux_appimage.sh package/TraceView-*-linux-x64.AppImage

  # ============================================================
  # Publish the GitHub Release packages feed into
  # ============================================================
  linux-flatpak:
    name: Linux Flatpak package and smoke
    uses: ./.github/workflows/flatpak.yml
    with:
      publish: true
    permissions:
      contents: write

  publish:
    name: Publish release
    needs: [windows-smoke, linux-smoke, linux-flatpak]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages

      - uses: actions/download-artifact@v4
        with:
          name: linux-flatpak-repo
          path: flatpak-repo

      - uses: actions/download-artifact@v4
        with:
          name: linux-flatpak-runtime-repo
          path: flatpak-runtime-repo

      - name: Update the GitHub Pages Flatpak repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git clone --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages; then
            echo 'Restored existing gh-pages branch'
          else
            rm -rf pages
            mkdir pages
            cd pages
            git init
            git checkout -b gh-pages
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cd ..
          fi
          rm -rf pages/flatpak pages/flatpak-runtime
          mkdir -p pages/flatpak pages/flatpak-runtime
          cp -a flatpak-repo/. pages/flatpak/
          cp -a flatpak-runtime-repo/. pages/flatpak-runtime/
          cp packaging/flatpak/TraceView.flatpakref pages/TraceView.flatpakref
          cp packaging/flatpak/traceview.flatpakrepo pages/traceview.flatpakrepo
          cp packaging/flatpak/traceview-runtime.flatpakrepo pages/traceview-runtime.flatpakrepo
          cp packaging/flatpak/index.html pages/index.html
          cd pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add flatpak flatpak-runtime TraceView.flatpakref traceview.flatpakrepo traceview-runtime.flatpakrepo index.html
          git commit -m "Publish TraceView ${GITHUB_REF_NAME}" || true
          git push origin gh-pages

      - name: Combine checksums
        run: |
          cat packages/windows-package/sha256-windows.txt packages/linux-package/sha256-linux.txt packages/linux-flatpak-package/sha256-flatpak.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            packages/windows-package/TraceView-*-windows-x64.exe \
            packages/linux-package/TraceView-*-linux-x64.AppImage \
            packages/linux-flatpak-package/TraceView-*-linux-x64.flatpak \
            SHA256SUMS.txt \
            --repo "${{ github.repository }}" \
            --title "TraceView ${{ github.ref_name }}" \
            --generate-notes \
            --prerelease

      # A tag in this same MAJOR.MINOR line (e.g. v2.5.4 superseding
      # v2.5.0-v2.5.3) means the older ones were patch-level fixes on top of
      # each other, not separate versions worth keeping visible -- retiring
      # them keeps the Releases page (and anyone browsing it by hand,
      # instead of through the self-updater, which always reads the newest
      # one anyway) from offering a known-broken download. `gh release
      # delete` without --cleanup-tag removes only the Release and its
      # assets; the git tag itself is left alone, so `vX.Y.Z` still resolves
      # to the exact commit it always did. A different MINOR or MAJOR (a
      # real new version, not a fix cycle) is never touched.
      - name: Retire older releases in this minor line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${{ github.ref_name }}"
          minor="${current%.*}"
          gh release list --repo "${{ github.repository }}" --json tagName --jq '.[].tagName' |
          while read -r tag; do
            if [ "$tag" != "$current" ] && [ "${tag%.*}" = "$minor" ]; then
              echo "Deleting superseded release $tag (its tag stays in git history)"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes
            fi
          done
